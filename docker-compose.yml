version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bev_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bev_analytics
      POSTGRES_USER: bev_user
      POSTGRES_PASSWORD: bev_secret_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bev_user -d bev_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bev_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: bev_ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # No host port mapping — host already runs Ollama on 11434.
    # Agents reach bev_ollama via docker network at http://ollama:11434.
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: bev_mlflow
    ports:
      - "5001:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://bev_user:bev_secret_password@postgres:5432/mlflow_db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlartifacts
    volumes:
      - mlartifacts:/mlartifacts
    command: >
      bash -c "pip install --quiet psycopg2-binary &&
      mlflow server
      --backend-store-uri postgresql://bev_user:bev_secret_password@postgres:5432/mlflow_db
      --default-artifact-root /mlartifacts
      --host 0.0.0.0
      --port 5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bev_backend
    ports:
      - "8000:8000"
    environment:
      BEV_POSTGRES_HOST: postgres
      BEV_POSTGRES_PORT: 5432
      BEV_POSTGRES_DB: bev_analytics
      BEV_POSTGRES_USER: bev_user
      BEV_POSTGRES_PASSWORD: bev_secret_password
      BEV_REDIS_HOST: redis
      BEV_REDIS_PORT: 6379
      BEV_MLFLOW_TRACKING_URI: http://mlflow:5000
      BEV_OLLAMA_HOST: http://ollama:11434
      BEV_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://frontend:3000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bev_worker
    command: celery -A workers.celery_app worker --loglevel=info
    environment:
      BEV_POSTGRES_HOST: postgres
      BEV_POSTGRES_PORT: 5432
      BEV_POSTGRES_DB: bev_analytics
      BEV_POSTGRES_USER: bev_user
      BEV_POSTGRES_PASSWORD: bev_secret_password
      BEV_REDIS_HOST: redis
      BEV_REDIS_PORT: 6379
      BEV_MLFLOW_TRACKING_URI: http://mlflow:5000
      BEV_OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bev_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped


  # 100-agent background workers (POC, per global CLAUDE.md §63 agentic-ai-layer)
  # Scale with: docker compose up -d --scale agents=100
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    # No container_name — replicas need unique auto-names
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      MODEL: gemma3:1b
      POLL_TIMEOUT: "5"
      OLLAMA_TIMEOUT: "60"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
  mlartifacts:
